name: Migrate verified Linux 0.4.2 packages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify the original public packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kord-distribution"
          cd "$RUNNER_TEMP/kord-distribution"
          base='https://github.com/seriousopponent/kord/releases/download/harness-v0.4.2-linux'
          curl --fail --location --retry 3 --output Kord-Harness-0.4.2-x86_64.AppImage "$base/Kord-Harness-0.4.2-x86_64.AppImage"
          curl --fail --location --retry 3 --output Kord-Harness-0.4.2-amd64.deb "$base/Kord-Harness-0.4.2-amd64.deb"
          printf '%s\n' \
            'daf208d100678caaad549c082cd02745731445f5eeabfdc361864a57dcb5464c  Kord-Harness-0.4.2-x86_64.AppImage' \
            'c7dabcd09acd241030b06608954d5066a6627457e1032368f38cab4a4eeb4f86  Kord-Harness-0.4.2-amd64.deb' > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach verified packages to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view harness-v0.4.2-linux --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
          gh release upload harness-v0.4.2-linux \
            "$RUNNER_TEMP/kord-distribution/Kord-Harness-0.4.2-x86_64.AppImage" \
            "$RUNNER_TEMP/kord-distribution/Kord-Harness-0.4.2-amd64.deb" \
            --repo "$GITHUB_REPOSITORY" --clobber
